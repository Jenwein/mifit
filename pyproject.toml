[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mifit"
version = "0.1.0"
description = "Read your own Mi Fitness data from the Xiaomi cloud."
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES"]
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31",
    "qrcode>=7.4",
]

[project.optional-dependencies]
# For running the tests: pytest, and the IANA zone database for the DST tests on
# systems that have none (Windows).
test = ["pytest>=8", "tzdata"]

[project.scripts]
mifit = "mifit.cli:main"

# src layout: the ``mifit`` package (and its subpackages) live under src/.
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Same effect as tests/conftest.py: tests import ``mifit`` from src/ whether or
# not the package has been installed (``pip install -e .``).
pythonpath = ["src"]
