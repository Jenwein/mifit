[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mifit"
version = "0.3.2"
description = "Read your own Mi Fitness data from the Xiaomi cloud."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES"]
requires-python = ">=3.12"
keywords = [
    "mi-fitness", "xiaomi", "health", "fitness", "wearable", "sleep", "heart-rate",
    "mcp", "model-context-protocol",
]
# No License classifier: the `license` expression above replaces it (PEP 639).
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "requests>=2.31",
    # The png extra (pypng, pure Python) draws the login QR code the MCP server returns.
    "qrcode[png]>=7.4",
    "cryptography>=42",
    # The MCP server (`mifit mcp`); imported only when that command runs.
    "mcp>=2.3,<3",
]

[project.optional-dependencies]
# For running the tests: pytest, the IANA zone database for the DST tests on
# systems that have none (Windows), and PyYAML for the release workflow's
# structure test.
test = ["pytest>=8", "tzdata", "pyyaml"]

[project.urls]
Homepage = "https://github.com/Jenwein/mifit"
Source = "https://github.com/Jenwein/mifit"
Issues = "https://github.com/Jenwein/mifit/issues"
Changelog = "https://github.com/Jenwein/mifit/blob/main/CHANGELOG.md"

[project.scripts]
mifit = "mifit.cli:main"

# src layout: the ``mifit`` package (and its subpackages) live under src/.
[tool.setuptools.packages.find]
where = ["src"]

# The marker that tells type checkers the package ships its own annotations.
[tool.setuptools.package-data]
mifit = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Same effect as tests/conftest.py: tests import ``mifit`` from src/ whether or
# not the package has been installed (``pip install -e .``).
pythonpath = ["src"]
