# Release: build mifit, check it, and publish it.
#
# - Pushing a tag vX.Y.Z publishes that version to PyPI, then creates the
#   GitHub Release with the CHANGELOG section and the built files.
# - After PyPI, a tag push also publishes server.json to the official MCP
#   Registry, with the job's OIDC token and no stored secret.
# - Running the workflow by hand (workflow_dispatch) publishes to TestPyPI
#   only: a dry run.
#
# Publishing uses PyPI Trusted Publishing: each publish job gets a short-lived
# OIDC token, and nothing here holds a PyPI token. The trusted publishers on
# PyPI and TestPyPI name this file (release.yml) and the environments `pypi`
# and `testpypi`; renaming any of them breaks publishing.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Test (offline)
        run: python -m pytest -q -rs

  build:
    name: Build and check the distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Read the version
        id: meta
        run: echo "version=$(python tools/release.py version)" >> "$GITHUB_OUTPUT"
      - name: Tag, pyproject and CHANGELOG agree
        if: github.ref_type == 'tag'
        run: python tools/release.py check-version --tag "$GITHUB_REF_NAME"
      - name: Install the build tools
        run: python -m pip install build twine
      - name: Build
        run: python -m build
      - name: Check the metadata
        run: twine check --strict dist/*
      - name: Check the contents
        run: python tools/release.py check-dist dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: server-json
          path: server.json
          if-no-files-found: error

  smoke:
    name: Install the wheel (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Install the built wheel
        run: python -m pip install dist/*.whl
      - name: The command and the package report the built version
        run: |
          test "$(mifit --version)" = "mifit ${{ needs.build.outputs.version }}"
          mifit --help
          python -c "import mifit; assert mifit.__version__ == '${{ needs.build.outputs.version }}'"
      - name: The MCP server answers over stdio
        run: |
          python - <<'EOF'
          # Like a client: wait for each reply before closing stdin, because the
          # server stops at the end of stdin and drops requests still in flight.
          import json, subprocess, threading
          msgs = [
              {"jsonrpc": "2.0", "id": 1, "method": "initialize", "params": {"protocolVersion": "2025-06-18", "capabilities": {}, "clientInfo": {"name": "smoke", "version": "0"}}},
              {"jsonrpc": "2.0", "method": "notifications/initialized"},
              {"jsonrpc": "2.0", "id": 2, "method": "tools/list"},
          ]
          proc = subprocess.Popen(["mifit", "mcp"], stdin=subprocess.PIPE, stdout=subprocess.PIPE,
                                  stderr=subprocess.PIPE, text=True, encoding="utf-8")
          watchdog = threading.Timer(120, proc.kill)
          watchdog.daemon = True  # never keeps the script alive after the check
          watchdog.start()
          replies = []
          for m in msgs:
              proc.stdin.write(json.dumps(m) + "\n")
              proc.stdin.flush()
              if "id" in m:
                  replies.append(json.loads(proc.stdout.readline()))
          rest, err = proc.communicate()  # closes stdin (closing it first fails on Python 3.12)
          assert proc.returncode == 0, err
          assert rest == "", rest
          assert [r["id"] for r in replies] == [1, 2], replies
          names = {t["name"] for t in replies[1]["result"]["tools"]}
          assert "get_status" in names, names
          print("MCP server answered:", len(names), "tools")
          EOF

  publish-pypi:
    name: Publish to PyPI
    needs: [test, build, smoke]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/mifit
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-testpypi:
    name: Publish to TestPyPI (dry run)
    needs: [test, build, smoke]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/p/mifit
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # A dry run can be repeated for the same version.
          skip-existing: true

  publish-mcp-registry:
    name: Publish to the MCP Registry
    needs: [build, publish-pypi]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: server-json
          path: registry/
      - name: Install mcp-publisher v1.8.1
        run: |
          curl -sSfL -o mcp-publisher.tar.gz https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz" | sha256sum --check
          tar -xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher validate registry/server.json
      - name: Publish
        run: |
          # The registry reads the version from PyPI, which can take a moment to list a
          # version it has just accepted. Each try logs in again for a fresh token.
          for attempt in 1 2 3 4 5 6; do
            if ./mcp-publisher login github-oidc && ./mcp-publisher publish registry/server.json; then
              exit 0
            fi
            echo "Try $attempt failed; trying again in 20 s." >&2
            sleep 20
          done
          exit 1

  github-release:
    name: GitHub Release
    needs: [build, publish-pypi]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Release notes from the CHANGELOG
        run: python tools/release.py notes "${{ needs.build.outputs.version }}" > notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
